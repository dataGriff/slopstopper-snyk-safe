name: SlopStopper · SBOM

# Produces a software bill of materials for every manifest Snyk resolves
# (`snyk sbom --all-projects`, the CLI pinned in mise.toml), in the format
# `security.sbom.format` names (default CycloneDX 1.5 JSON), and uploads it
# as the run's artifact. The check itself is the gate: it exits 0 when the
# SBOM was written, 1 when Snyk found no manifest to build one from (set
# `security.sbom.allow_empty: true` for a repo with no dependencies) and 2
# when it couldn't run. Triggers: PR, push to main, manual dispatch. Emits
# a rolling PR comment and a main-branch tracking issue when no SBOM could
# be produced (exit 1 only).
#
# Needs: the SNYK_TOKEN repository secret (a service-account token).
# Optional repository variables: SNYK_ORG (the organisation slug to scan
# under) and SNYK_API (a regional endpoint such as https://api.eu.snyk.io).
# Docs: docs/security/README.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Software Bill of Materials with Snyk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, snyk, gitleaks) and
        # the pinned slopstopper-cli (from source in the slopstopper repo).
        # One local composite action; install.sh copies it in next to the
        # workflows.
        uses: ./.github/actions/ss-setup

      # The check itself is the gate: it exits 1 when no SBOM could be
      # built, so this step's outcome IS the verdict, and the local
      # `task ss:security:sbom` agrees with CI.
      - name: Generate the SBOM
        id: sbom
        # `task -x` passes the CLI's exit code through (plain `task` maps
        # every failure to 201). The code is kept as an output so later
        # steps can tell an empty SBOM (1) from could-not-run (2).
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_API: ${{ vars.SNYK_API }}
        run: |
          set +e
          task -x ss:security:sbom
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: .ss/reports/sbom/
          # The SBOM is a compliance artifact: a procurement or audit
          # request asks what a given release shipped, so it is kept for
          # the longest retention GitHub allows by default. Raise the
          # repository's retention ceiling, or archive the artifact to
          # long-term storage, if 90 days is shorter than your policy.
          retention-days: 90
          if-no-files-found: warn

      - name: Emit PR comment
        if: always() && github.event_name == 'pull_request' && steps.sbom.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sbom --target pr-comment --status ${{ steps.sbom.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete

      - name: Emit issue on main (if no SBOM could be produced)
        # Only rc 1 is a verdict. Exit 2 means Snyk didn't run.
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sbom.outputs.rc == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sbom --target issue

      - name: Close issue on main when clean
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sbom.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sbom --target issue --on-pass=close
