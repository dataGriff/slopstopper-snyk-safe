name: SlopStopper · Secrets Detection

# Scans the full git history for committed secrets with Gitleaks (the
# exact version pinned in mise.toml, put on PATH by ss-setup; no download
# in the workflow). The check itself is the gate: it exits 1 on a finding
# and 2 when the scan couldn't run. Triggers: PR, push to main, manual
# dispatch. Emits a rolling PR comment (keyed on the "Secrets Detection"
# substring so each PR shows one rolling comment, not duplicates) and a
# main-branch tracking issue on findings (exit 1 only).
#
# Needs: nothing beyond GITHUB_TOKEN. Gitleaks runs offline; no SNYK_*
# secret or variable is read here.
# Docs: docs/security/README.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Detect Secrets with Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, snyk, gitleaks) and
        # the pinned slopstopper-cli (from source in the slopstopper repo).
        # One local composite action; install.sh copies it in next to the
        # workflows.
        uses: ./.github/actions/ss-setup

      # The check itself is the gate: it exits 1 on blocking findings, so
      # this step's outcome IS the verdict. No separate detect / fail-job
      # steps, and the local `task ss:security:secrets` agrees with CI.
      - name: Run secrets detection
        id: secrets
        # `task -x` passes the CLI's exit code through (plain `task` maps
        # every failure to 201). The code is kept as an output so later
        # steps can tell findings (1) from could-not-run (2).
        shell: bash
        run: |
          set +e
          task -x ss:security:secrets
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload secrets reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-reports
          path: |
            .ss/reports/secrets/secrets-report.md
            .ss/reports/secrets/secrets-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Emit PR comment
        if: always() && github.event_name == 'pull_request' && steps.secrets.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target pr-comment --status ${{ steps.secrets.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete

      - name: Emit issue on main (if secrets detected)
        # Only rc 1 is a finding. Exit 2 means the scan didn't run.
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.secrets.outputs.rc == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target issue

      - name: Close issue on main when clean
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.secrets.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:secrets --target issue --on-pass=close
