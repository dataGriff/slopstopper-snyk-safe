name: SlopStopper · SAST Analysis

# Runs Snyk Code static analysis over the repository (`snyk code test`,
# the CLI pinned in mise.toml). The check itself is the gate: it exits 1
# when a finding is at or above `security.sast.fail_on` (default: high)
# and 2 when the scan couldn't run (no token, Snyk Code off for the org,
# no readable SARIF); findings below the threshold are reported but
# non-blocking. Triggers: PR, push to main, manual dispatch. Emits a
# rolling PR comment with all findings and a main-branch tracking issue
# when blocking findings land (exit 1 only).
#
# Needs: the SNYK_TOKEN repository secret (a service-account token).
# Optional repository variables: SNYK_ORG (the organisation slug to scan
# under) and SNYK_API (a regional endpoint such as https://api.eu.snyk.io).
# Docs: docs/security/README.md.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Static Application Security Testing with Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, snyk, gitleaks) and
        # the pinned slopstopper-cli (from source in the slopstopper repo).
        # One local composite action; install.sh copies it in next to the
        # workflows.
        uses: ./.github/actions/ss-setup

      # The check itself is the gate: it exits 1 on blocking findings, so
      # this step's outcome IS the verdict. No separate detect / fail-job
      # steps, and the local `task ss:security:sast` agrees with CI.
      - name: Run SAST analysis
        id: sast
        # `task -x` passes the CLI's exit code through (plain `task` maps
        # every failure to 201). The code is kept as an output so later
        # steps can tell findings (1) from could-not-run (2).
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_API: ${{ vars.SNYK_API }}
        run: |
          set +e
          task -x ss:security:sast
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-reports
          path: |
            .ss/reports/sast/sast-report.md
            .ss/reports/sast/sast-report.sarif
          retention-days: 30
          if-no-files-found: warn

      # The SARIF above is the format GitHub code scanning ingests. An
      # organisation with GitHub Advanced Security can add a step here that
      # uploads it with github/codeql-action/upload-sarif (pinned to a
      # commit SHA, `security-events: write` added to permissions) so the
      # same scan feeds the Security tab. Not added by default: the suite
      # ships no third-party action it does not need on every repo.

      - name: Emit PR comment
        if: always() && github.event_name == 'pull_request' && steps.sast.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sast --target pr-comment --status ${{ steps.sast.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete

      - name: Emit issue on main (if blocking findings)
        # Only rc 1 is a finding. Exit 2 means the scan didn't run.
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sast.outputs.rc == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sast --target issue

      - name: Close issue on main when clean
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.sast.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit security:sast --target issue --on-pass=close
